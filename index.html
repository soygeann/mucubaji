<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión Personal - Humberto Rincón</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    
    <style>
        :root {
            --primary-color: #2e7d32;
            --bg-dark: #000000;
            --text-light: #ffffff;
            --border-color: #333;
        }

        body, html {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-light);
            overflow-x: hidden;
        }

        /* --- VISTA DE INICIO (FRONT) --- */
        #home-view {
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        .hero-section {
            position: relative;
            height: 60vh;
            background: url('humberto.jpg') no-repeat center center; /* Reemplaza con tu foto */
            background-size: cover;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            align-items: center;
            text-align: center;
        }

        /* Degradado blanco para los textos */
        .hero-overlay {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(to bottom, rgba(255,255,255,0) 20%, rgba(255,255,255,1) 95%);
            z-index: 1;
        }

        .hero-content {
            position: relative;
            z-index: 2;
            padding-bottom: 20px;
            color: #000;
        }

        .hero-content h1 {
            margin: 0;
            font-size: 30px;
            letter-spacing: 1px;
            text-transform: uppercase;
            font-weight: 900;
        }

        .hero-content p {
            margin: 5px 0 30px;
            font-size: 24px;
            font-weight: 300;
        }

        /* Sección de Cuadros (Fondo Negro) */
        .management-section {
            background-color: var(--bg-dark);
            padding: 30px 20px;
            flex-grow: 1;
            display: flex;
            justify-content: center;
            gap: 20px;
            flex-wrap: wrap;
            border-top-left-radius: 40px;
            border-top-right-radius: 40px;
            margin-top: -30px;
            z-index: 3;
            position: relative;
        }

        .card {
            width: 160px;
            height: 200px;
            border-radius: 20px;
            overflow: hidden;
            position: relative;
            cursor: pointer;
            transition: transform 0.3s ease;
            /* border: 1px solid #333; */
            background: linear-gradient(to bottom, rgba(0, 0, 0, 0) 20%, rgba(0, 0, 0, 1) 95%);
        }

        .card:active {
            transform: scale(0.95);
        }

        .card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            opacity: 0.9;
        }

        .card-title {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            padding: 17px 0px;
            background: rgba(0,0,0,0.6);
            background: linear-gradient(to bottom, rgba(0, 0, 0, 0) 20%, rgba(0, 0, 0, 1) 120%);
            text-align: center;
            font-size: 16px;
            font-weight: bold;
            text-transform: uppercase;
        }

        /* --- VISTA DE GESTIÓN DE RECIBOS (FORMULARIO) --- */
        #receipt-view {
            display: none;
            padding: 20px;
            background-color: #f4f4f4;
            color: #000;
            min-height: 100vh;
        }

        .header-app {
            display: flex;
            align-items: center;
            margin-bottom: 20px;
            gap: 15px;
        }

        .back-btn {
            background: #fff;
            border: 1px solid #ccc;
            padding: 10px 12px;
            border-radius: 100%;
            cursor: pointer;
            font-size: 18px;
        }

        .form-container {
            /* width: 100%; */
            max-width: 600px;
            background: #fff;
            padding: 20px;
            border: 1px solid #ddd;
            border-radius: 12px;
            margin: 0 auto 20px;
        }

        .form-group { margin-bottom: 12px; }
        .form-group label { display: block; margin-bottom: 4px; font-weight: bold; font-size: 12px; }
        .form-group input { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; }

        .btn-main {
            background-color: var(--primary-color);
            color: white; border: none; padding: 12px;
            font-size: 14px; border-radius: 6px; width: 100%; cursor: pointer;
        }

        /* El Recibo (Igual al anterior pero adaptado) */
        .receipt-container {
            background: #fff; padding: 15px; border: 2px solid #333; margin-top: 15px; /* width: 100%; */ max-width: 600px; margin: 20px auto;
        }
        /* ... Estilos internos del recibo heredados del anterior ... */
        .r-header { display: flex; justify-content: space-between; border-bottom: 2px solid #333; padding-bottom: 5px; margin-bottom: 10px; }
        .actions { display: flex; flex-direction: column; gap: 10px; margin-top: 20px; align-items: center; }
        .btn-action { padding: 10px 20px; border-radius: 5px; border: none; color: white; width: 100%; max-width: 300px; cursor: pointer; }

    </style>
</head>
<body>

    <div id="home-view">
        <div class="hero-section">
            <!-- <div style="position: absolute; top: 20px; right: 20px; background: white; color: black; border-radius: 50%; width: 35px; height: 35px; display: flex; align-items: center; justify-content: center; z-index: 10;">
                🏠
            </div> -->
            <div class="hero-overlay"></div>
            <div class="hero-content">
                <h1>Humberto Rincón</h1>
                <p>Gestión personal</p>
            </div>
        </div>

        <div class="management-section">
            <div class="card" onclick="showView('receipt-view')">
                <img src="mucubaji_bg.jpg" alt="Conjunto Mucubají">
                <div class="card-title">Conjunto Mucubají</div>
            </div>

            <div class="card" onclick="alert('Módulo en desarrollo...')">
                <img src="cosmeticos_bg.jpg" alt="Cosméticos">
                <div class="card-title">Cosméticos Mariangel</div>
            </div>
        </div>
    </div>

    <div id="receipt-view">
        <div class="header-app">
            <button class="back-btn" onclick="showView('home-view')">←</button>
            <h2 style="margin:0; font-size: 18px;">Gestión de Recibos</h2>
        </div>

        <div class="form-container">
            <div class="form-group">
                <label>Fecha:</label>
                <input type="date" id="input-fecha">
            </div>
            <div class="form-group">
                <label>Nombre y Apellido:</label>
                <input type="text" id="input-nombre" placeholder="Ej. Alba">
            </div>
            <div class="form-group">
                <label>Casa:</label>
                <input type="text" id="input-casa" placeholder="Ej. # 2 -32">
            </div>
            <div class="form-group">
                <label>Mes a cancelar:</label>
                <input type="text" id="input-mes" placeholder="Ej. Mes de Marzo">
            </div>
            <div class="form-group">
                <label>Monto:</label>
                <input type="number" step="0.01" id="input-monto">
            </div>
            <div class="form-group">
                <label>Tipo de Pago:</label>
                <input type="text" id="input-tipo-pago" placeholder="Ej. Pago Movil">
            </div>
            <div class="form-group">
                <label>Referencia:</label>
                <input type="text" id="input-referencia">
            </div>
            <button class="btn-main" onclick="generarFactura()">Generar Factura</button>
        </div>

        <div id="receipt-section" class="receipt-container" style="display: none; color: black;">
            <div class="r-header">
                <div><img src="logo.png" width="60" id="r-logo"></div>
                <div style="text-align: right;">
                    <div style="font-size: 12px; font-weight: bold;">ASOCIACIÓN CIVIL CONJUNTO II MUCUBAJI</div>
                    <div style="font-size: 10px;">RIF: J-400991839</div>
                    <div style="font-size: 11px;">Fecha: <span id="out-fecha"></span></div>
                </div>
            </div>
            <div style="font-size: 12px; margin-bottom: 10px; border: 1px solid #333; padding: 5px;">
                Nombre y Apellido: <b id="out-nombre"></b>
            </div>
            <table style="width: 100%; border-collapse: collapse; font-size: 11px;">
                <tr>
                    <th style="border: 1px solid #333; padding: 5px;">Casa</th>
                    <th style="border: 1px solid #333; padding: 5px;">Descripción</th>
                    <th style="border: 1px solid #333; padding: 5px;">Monto</th>
                </tr>
                <tr>
                    <td style="border: 1px solid #333; padding: 5px; text-align: center;" id="out-casa"></td>
                    <td style="border: 1px solid #333; padding: 5px; position: relative;">
                        <span id="out-mes"></span>
                        <img src="sello.png" style="position: absolute; right: 5px; top: 0; width: 60px; opacity: 0.8;">
                    </td>
                    <td style="border: 1px solid #333; padding: 5px; text-align: right;" id="out-monto"></td>
                </tr>
                <tr>
                    <td colspan="2" style="border: 1px solid #333; padding: 5px;">
                        Pago: <span id="out-tipo-pago"></span><br>Ref: <span id="out-referencia"></span>
                    </td>
                    <td style="border: 1px solid #333; padding: 5px; text-align: right; font-weight: bold;">
                        TOTAL: <span id="out-total"></span>
                    </td>
                </tr>
            </table>
            <div style="font-size: 9px; text-align: center; margin-top: 10px;">Gracias por realizar el pago a su condominio</div>
        </div>

        <div class="actions" id="actions-section" style="display: none;">
            <button class="btn-action" onclick="descargarPDF()" style="background: #2e7d32;">Descargar PDF</button>
            <button class="btn-action" onclick="window.scrollTo(0,0); alert('Toma la captura ahora')" style="background: #1976d2;">Listo para Captura</button>
        </div>
    </div>

    <script>
        // Lógica de navegación
        function showView(viewId) {
            document.getElementById('home-view').style.display = 'none';
            document.getElementById('receipt-view').style.display = 'none';
            document.getElementById(viewId).style.display = 'block';
            window.scrollTo(0,0);
        }

        // Lógica del Recibo
        document.getElementById('input-fecha').valueAsDate = new Date();

        function generarFactura() {
            const campos = ['fecha', 'nombre', 'casa', 'mes', 'monto', 'tipo-pago', 'referencia'];
            campos.forEach(c => {
                let val = document.getElementById('input-' + c).value;
                if(c === 'monto') val = parseFloat(val).toLocaleString('es-ES', {minimumFractionDigits: 2});
                document.getElementById('out-' + c).innerText = val;
            });
            document.getElementById('out-total').innerText = document.getElementById('out-monto').innerText;
            
            document.getElementById('receipt-section').style.display = 'block';
            document.getElementById('actions-section').style.display = 'flex';
            document.getElementById('receipt-section').scrollIntoView({behavior: 'smooth'});
        }

        function descargarPDF() {
            const element = document.getElementById('receipt-section');
            const opt = {
                margin: 10,
                filename: 'Recibo_Mucubaji.pdf',
                image: { type: 'jpeg', quality: 0.98 },
                html2canvas: { scale: 3 },
                jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' }
            };
            html2pdf().set(opt).from(element).save();
        }
    </script>
</body>
</html>
